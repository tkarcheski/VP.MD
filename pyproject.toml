[project]
name = "vp-md"
version = "0.1.0"
description = "JD Vance Personality Module - Production-grade autonomous AI agent"
readme = "README.md"
authors = [
    { name = "Tyler Karcheski", email = "tyler.karcheski@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
vp-md = "vp_md:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
